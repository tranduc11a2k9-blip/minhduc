name: Build MINHDUC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          # dm.pl is a separate repo that `make package` requires (not in main clone)
          git clone --depth 1 https://github.com/theos/dm.pl.git "$HOME/theos/vendor/dm.pl"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          chmod +x "$HOME/theos/vendor/dm.pl/dm.pl" || true

      - name: Install iOS SDK
        run: |
          cd "$HOME/theos"
          git clone --depth 1 --filter=blob:none https://github.com/xybp888/iOS-SDKs.git sdks-tmp || \
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git sdks-tmp
          cp -r sdks-tmp/iPhoneOS16.5.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks/"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          make -f Makefile.app clean || true
          make -f Makefile.app package FINALPACKAGE=1 2>&1 | tail -50
          ls -la packages/ || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MINHDUC-ipa
          path: packages/*.ipa
          if-no-files-found: warn
