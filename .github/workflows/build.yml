name: Build MINHDUC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (with vendor submodules)
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks/"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          make -f Makefile.app clean || true
          make -f Makefile.app package FINALPACKAGE=1 2>&1 | tail -80
          echo "=== packages ==="
          ls -la packages/ || true
          echo "=== find ipa ==="
          find . -name "*.ipa" -o -name "*.tipa" 2>/dev/null | head -10

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MINHDUC-ipa
          path: packages/*.ipa
          if-no-files-found: warn
