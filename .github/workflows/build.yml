name: Build MINHDUC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # theos.git main clone does NOT include vendor submodules with plain clone
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          # dm.pl is required by `make package` (installed into vendor/dm.pl)
          mkdir -p "$HOME/theos/vendor"
          git clone --depth 1 https://github.com/theos/dm.pl.git "$HOME/theos/vendor/dm.pl"
          # vendor/include + vendor/lib (headers and libs like CydiaSubstrate)
          git clone --depth 1 https://github.com/theos/vendor.git "$HOME/theos/vendor-tmp"
          cp -R "$HOME/theos/vendor-tmp/." "$HOME/theos/vendor/"
          rm -rf "$HOME/theos/vendor-tmp"
          ls "$HOME/theos/vendor/" | head -20
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks/"

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          make -f Makefile.app clean || true
          make -f Makefile.app package FINALPACKAGE=1 2>&1 | tail -80
          echo "=== packages ==="
          ls -la packages/ || true
          echo "=== find ipa ==="
          find . -name "*.ipa" -o -name "*.tipa" 2>/dev/null | head -10

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MINHDUC-ipa
          path: packages/*.ipa
          if-no-files-found: warn