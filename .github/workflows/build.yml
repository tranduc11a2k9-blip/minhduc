name: Build MINHDUC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (with vendor submodules)
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          mkdir -p "$THEOS/sdks"
          # Tonwalter888/iOS-SDKs has SDKs as real files (no submodules) — works with plain clone
          git clone --depth 1 https://github.com/Tonwalter888/iOS-SDKs.git /tmp/sdks
          ls /tmp/sdks/
          cp -R /tmp/sdks/iPhoneOS18.6.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE"
          make -f Makefile.app clean || true
          make -f Makefile.app package FINALPACKAGE=1 2>&1 | tail -80
          echo "=== packages ==="
          ls -la packages/ || true
          echo "=== find ipa ==="
          find . -name "*.ipa" -o -name "*.tipa" 2>/dev/null | head -10

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MINHDUC-ipa
          path: packages/*.ipa
          if-no-files-found: warn
